name: Apply Marinara brand artwork fix

on:
  push:
    branches: [restaurant/marinara-ristorante-v1-brand-artwork-fix]
    paths: ['.github/workflows/marinara-brand-artwork-fix.yml']

permissions:
  contents: write

concurrency:
  group: marinara-brand-artwork-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preserve full supplied brand artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/components/business-sites/restaurant/marinara-ristorante/MarinaraPage.module.css')
          s=p.read_text()
          changes={
            ".ritual { max-width:1450px; margin:auto; padding:105px 6%; display:grid; grid-template-columns:.82fr 1.18fr; gap:70px; align-items:center; }": ".ritual { max-width:1450px; margin:auto; padding:105px 6%; display:grid; grid-template-columns:minmax(460px,.95fr) minmax(0,1.05fr); gap:clamp(42px,4.5vw,70px); align-items:center; }",
            ".ritualCover { position:absolute; inset:0 24% 8% 0; width:76%; height:92%; object-fit:cover; border-radius:180px 180px 24px 24px; }": ".ritualCover { position:absolute; inset:2% 18% 6% 0; width:82%; height:92%; object-fit:contain; object-position:center; padding:clamp(20px,3vw,42px); background:#f5e6b7; border-radius:110px 110px 28px 28px; box-shadow:0 18px 52px rgba(69,42,35,.10); }",
            ".brandStrip > div:first-child,.brandStrip > div:last-child { padding:0; }": ".brandStrip > div:first-child,.brandStrip > div:last-child { padding:22px; }",
            ".brandStrip > div:first-child img,.brandStrip > div:last-child img { width:100%; height:100%; object-fit:cover; }": ".brandStrip > div:first-child img,.brandStrip > div:last-child img { width:100%; height:100%; object-fit:contain; object-position:center; }",
            "  .ritualCover { right:20%; width:80%; }": "  .ritualCover { inset:4% 12% 8% 0; width:88%; height:88%; padding:18px; border-radius:58px 58px 20px 20px; }",
          }
          for old,new in changes.items():
              if old not in s:
                  raise SystemExit(f'Missing expected CSS block: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:frontend
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install isolated browser QA tools
        working-directory: frontend
        run: |
          npm install --prefix "$RUNNER_TEMP/marinara-browser" --no-package-lock --no-save playwright@1.58.2
          node "$RUNNER_TEMP/marinara-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify Marinara responsive browser layout
        working-directory: frontend
        run: |
          mkdir -p outputs/marinara
          npm run dev -- --hostname 127.0.0.1 --port 4173 > outputs/marinara/dev-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat outputs/marinara/dev-server.log; exit 1; fi
            if curl --silent --fail --max-time 10 http://127.0.0.1:4173/preview/marinara-ristorante > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail --max-time 10 http://127.0.0.1:4173/preview/marinara-ristorante > /dev/null || { cat outputs/marinara/dev-server.log; exit 1; }
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/marinara-browser/node_modules/playwright/index.mjs" FRONTEND_URL=http://127.0.0.1:4173 node scripts/marinara-browser-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: marinara-brand-artwork-fix-review
          path: frontend/outputs/marinara/
          retention-days: 2
          if-no-files-found: warn
      - name: Commit verified fix and remove one-time workflow
        run: |
          test "$GITHUB_REF" = refs/heads/restaurant/marinara-ristorante-v1-brand-artwork-fix
          git add frontend/components/business-sites/restaurant/marinara-ristorante/MarinaraPage.module.css
          git rm .github/workflows/marinara-brand-artwork-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: show Marinara brand artwork in full"
          git push origin HEAD:refs/heads/restaurant/marinara-ristorante-v1-brand-artwork-fix
