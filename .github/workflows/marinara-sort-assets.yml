| --- | --- |
| `marinara-buon-cibo-logo-full.png` | Full Marinara wordmark / identity artwork. |
| `marinara-buon-cibo-logo.png` | Standalone utensil/chili brand mark. |
| `marinara-buon-cibo.png` | “Buon Cibo Bella Vita!” brand lockup. |
| `marinara-coverphoto.jpg` | Branded cover graphic with Marinara wordmark, not an ambience photo. |
| `marinara-logo-clear.png` | Clear standalone brand mark. |
| `marinara-logo-meta-thumbnail.png` | Branded social/meta thumbnail artwork. |
| `marinara-logo.jpg` | Alternate brand-mark presentation on red ground. |

## Atmosphere — 1

| File | Classification note |
| --- | --- |
| `marinara-interior.jpg` | Restaurant dining-room interior: tables, seating, wall finishes and lighting. |

