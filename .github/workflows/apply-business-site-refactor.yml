name: Apply reviewed business-site refactor
on:
  push:
    branches: [restaurant/the-rib-crib-v2]
    paths: ['.github/refactor/**', '.github/workflows/apply-business-site-refactor.yml']
permissions:
  contents: write
concurrency:
  group: apply-reviewed-business-site-refactor
  cancel-in-progress: false
jobs:
  refactor:
    if: github.repository == 'jourdese/business-automation-public' && github.ref == 'refs/heads/restaurant/the-rib-crib-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Guard the review branch and clean checkout
        run: |
          test "$GITHUB_REF" = refs/heads/restaurant/the-rib-crib-v2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Apply the reviewed mechanical changes
        run: |
          python -m pip install tinycss2==1.5.1
          python .github/refactor/restructure.py
          python .github/refactor/additions.py
          git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:frontend
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit only the verified source to the review branch
        run: |
          test "$GITHUB_REF" = refs/heads/restaurant/the-rib-crib-v2
          test "$(git ls-remote origin refs/heads/restaurant/the-rib-crib-v2 | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code -- vercel.json frontend/vercel.json frontend/package-lock.json frontend/public frontend/lib/jourvis
          git diff --exit-code -- .github/workflows
          git add -A -- frontend docs
          git rm -- .github/refactor/restructure.py .github/refactor/additions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "refactor: organize business sites and isolate shared restaurant features"
          git push origin HEAD:refs/heads/restaurant/the-rib-crib-v2
