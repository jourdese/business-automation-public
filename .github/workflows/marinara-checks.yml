name: Marinara menu checks
on:
  push:
    branches: [restaurant/marinara-ristorante-v1]
permissions:
  contents: read
concurrency:
  group: marinara-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run build
      - name: Export deterministic review fixture
        run: |
          mkdir -p outputs/marinara
          node --experimental-strip-types scripts/export-marinara-menu.ts --json > outputs/marinara/marinara-demo-preset.json
          node --experimental-strip-types scripts/export-marinara-menu.ts --sql > outputs/marinara/marinara-menu-seed.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marinara-menu-review
          path: frontend/outputs/marinara/
          retention-days: 3
