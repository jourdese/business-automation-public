name: Marinara source review
on:
  push:
    branches: [restaurant/marinara-ristorante-v1]
    paths: [.github/workflows/marinara-source-review.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published reference photographs
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          output = pathlib.Path('/tmp/marinara-source-review')
          output.mkdir(exist_ok=True)
          # Public review images linked from Eats Me, Jax! (6 April 2025).
          # Research-only copies. Never bundled as restaurant-approved website assets.
          names = ['20250323_123144.jpg?w=768', '20250323_125213.jpg?w=1024', '20250323_125159.jpg?w=1024', '20250323_125146.jpg?w=1024', '20250323_125131.jpg?w=1024', '20250323_125104.jpg?w=1024', '20250323_125054.jpg?w=766', '20250323_125116.jpg?w=1024']
          results=[]
          for name in names:
              url='https://eatsmejax.com/wp-content/uploads/2025/04/'+name
              entry={'url':url, 'file':name.split('?')[0]}
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public restaurant source review)'})
                  with urllib.request.urlopen(request,timeout=12) as response:
                      data=response.read(8*1024*1024+1)
                      if len(data)>8*1024*1024 or not response.headers.get('Content-Type','').startswith('image/'): raise ValueError('Not a bounded image response')
                      (output/entry['file']).write_bytes(data)
                      entry.update(status=response.status,bytes=len(data))
              except Exception as error: entry['error']=str(error)
              results.append(entry)
          (output/'sources.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marinara-source-review
          path: /tmp/marinara-source-review/
          retention-days: 1
