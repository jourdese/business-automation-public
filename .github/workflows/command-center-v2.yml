name: Command Center V2
on:
  push:
    branches: [jourvis/command-center-v2]
  pull_request:
    branches: [main]
    paths: ['app/**','components/**','lib/**','data/**','scripts/**','supabase/**','tests/**','package*.json','next.config.ts','vercel.json','.github/workflows/command-center-v2.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:frontend
      - run: npm --prefix frontend run check:policies
      - run: npm run build
